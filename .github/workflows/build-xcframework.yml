name: Build XCFramework

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build-xcframework.sh'
      - '.github/workflows/build-xcframework.yml'

jobs:
  build:
    name: Build CLiteRTLM.xcframework
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          echo "Machine: $(uname -m)"
          echo "Memory: $(sysctl -n hw.memsize | awk '{print $1/1073741824 " GB"}')"
          echo "Cores: $(sysctl -n hw.ncpu)"
          xcodebuild -version
          df -h /

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode_15.3.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install Bazelisk
        run: |
          brew install bazelisk
          bazelisk version

      - name: Make script executable
        run: chmod +x scripts/build-xcframework.sh

      - name: Build XCFramework
        run: ./scripts/build-xcframework.sh
        env:
          BAZELISK_ARCH: arm64

      - name: Verify output
        run: |
          ls -la Frameworks/LiteRTLM.xcframework/
          file Frameworks/LiteRTLM.xcframework/ios-arm64/CLiteRTLM.framework/CLiteRTLM
          file Frameworks/LiteRTLM.xcframework/ios-arm64-simulator/CLiteRTLM.framework/CLiteRTLM

      - name: Zip XCFramework
        run: |
          cd Frameworks
          zip -ry LiteRTLM.xcframework.zip LiteRTLM.xcframework

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiteRTLM-xcframework
          path: Frameworks/LiteRTLM.xcframework.zip
          retention-days: 7
          if-no-files-found: error
