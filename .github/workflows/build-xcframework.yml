name: Build XCFramework

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build-xcframework.sh'
      - '.github/workflows/build-xcframework.yml'

jobs:
  build:
    name: Build CLiteRTLM.xcframework
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show available Xcodes
        run: ls /Applications/ | grep Xcode

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Show environment
        run: |
          xcodebuild -version
          sw_vers
          uname -m

      - name: Install Bazelisk
        run: brew install bazelisk

      - name: Make script executable
        run: chmod +x scripts/build-xcframework.sh

      - name: Build XCFramework
        env:
          BAZELISK_ARCH: arm64
        run: ./scripts/build-xcframework.sh

      - name: Verify output
        run: |
          ls -la Frameworks/LiteRTLM.xcframework/
          file Frameworks/LiteRTLM.xcframework/ios-arm64/CLiteRTLM.framework/CLiteRTLM
          file Frameworks/LiteRTLM.xcframework/ios-arm64-simulator/CLiteRTLM.framework/CLiteRTLM

      - name: Zip XCFramework
        run: |
          cd Frameworks
          zip -ry LiteRTLM.xcframework.zip LiteRTLM.xcframework

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiteRTLM-xcframework
          path: Frameworks/LiteRTLM.xcframework.zip
          retention-days: 7
          if-no-files-found: error
